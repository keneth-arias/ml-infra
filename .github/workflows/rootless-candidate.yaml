name: Verify private Nebius candidate images
on:
  pull_request:
    paths:
      - .github/workflows/rootless-candidate.yaml
      - bootstrap/microk8s/build-episodes.sh
      - runtime/episode_job.py
      - runtime/episode_stop.py
      - runtime/stage_episode_inputs.py
      - runtime/versioned_episode_inputs.py
      - runtime/Dockerfile.episodes
      - runtime/Dockerfile.preflight
      - ci/test_paired_image.py
      - bootstrap/nebius/management/rootless/**
      - bootstrap/nebius/releases/**
      - ci/oci_candidate.py
      - ci/verify-paired-image.py
      - ci/verify-rootless-image.py
      - ci/cpu_admission_receipt.py
      - platform/overlays/prod/sky-cpu/**
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  pull-and-verify:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {role: rootless-cpu, check: pull-and-verify}
          - {role: trainer, check: verify-paired-trainer}
          - {role: preflight, check: verify-paired-preflight}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Bind the rendered CPU policy to its qualification receipt
        if: matrix.role == 'rootless-cpu'
        run: |
          set -euo pipefail
          uv run --with PyYAML==6.0.3 python ci/cpu_admission_receipt.py "$RUNNER_TEMP/admitted.json" > "$RUNNER_TEMP/admitted-revision"
      - name: Prepare verification tools
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/sigstore/cosign/releases/download/v2.6.2/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          echo "d437b8f0d30f5dec169337607fcfa0238de1348503e175f1bb5b94330b1ee409  $RUNNER_TEMP/cosign" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cosign"
      - name: Cold pull the OCI index and verify the candidate
        env:
          ROLE: ${{ matrix.role }}
          REGISTRY_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_READ_TOKEN" | skopeo login --authfile "$DOCKER_CONFIG/config.json" -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          unset REGISTRY_READ_TOKEN
          pull_and_verify() {
            local commit=$1 image=$2 layout=$3
            shift 3
            skopeo copy --all --preserve-digests --authfile "$DOCKER_CONFIG/config.json" \
              "docker://$image" "oci:$layout:qualified"
            python3 "$@" "$layout"
            "$RUNNER_TEMP/cosign" verify --key bootstrap/nebius/releases/qualification.pub \
              --insecure-ignore-tlog=true -a "role=$ROLE" -a "build_commit=$commit" "$image"
          }
          if [[ "$ROLE" != rootless-cpu ]]; then
            [[ "$ROLE" == preflight || "$ROLE" == trainer ]]
            receipt=bootstrap/nebius/releases/flamingo-candidate.json
            commit=$(jq -er .build_commit "$receipt")
            digest=$(jq -er --arg role "$ROLE" '.images[$role].index' "$receipt")
            [[ "$commit" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            git merge-base --is-ancestor "$commit" HEAD
            git diff --exit-code "$commit" HEAD -- bootstrap/microk8s/build-episodes.sh \
              runtime/{episode_job.py,episode_stop.py,stage_episode_inputs.py,versioned_episode_inputs.py,Dockerfile.episodes,Dockerfile.preflight}
            image="ghcr.io/keneth-arias/ml-infra-qwen@$digest"
            pull_and_verify "$commit" "$image" "$RUNNER_TEMP/pulled" ci/verify-paired-image.py "$receipt" "$ROLE"
            exit 0
          fi
          verify_receipt() {
            local receipt=$1 source_revision=$2 layout=$3 commit digest image
            commit=$(jq -er .build_commit "$receipt")
            digest=$(jq -er .index "$receipt")
            [[ $commit =~ ^[0-9a-f]{40}$ && $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(git rev-parse --verify "refs/tags/rootless-build-$commit^{commit}")" = "$commit"
            git diff --exit-code "$commit" "$source_revision" -- bootstrap/nebius/management/rootless \
              ':(exclude)bootstrap/nebius/management/rootless/README.md'
            image="ghcr.io/keneth-arias/ml-infra-sky-cpu@$digest"
            pull_and_verify "$commit" "$image" "$layout" ci/verify-rootless-image.py "$receipt"
          }
          current=bootstrap/nebius/releases/rootless-candidate.json
          verify_receipt "$current" HEAD "$RUNNER_TEMP/candidate"
          if ! cmp -s "$current" "$RUNNER_TEMP/admitted.json"; then
            verify_receipt "$RUNNER_TEMP/admitted.json" "$(cat "$RUNNER_TEMP/admitted-revision")" "$RUNNER_TEMP/admitted"
          fi
