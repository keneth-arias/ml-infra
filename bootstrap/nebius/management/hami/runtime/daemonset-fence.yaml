apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-gpu-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: nebius-hami-runtime-daemonsets
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: nvidia-gpu-operator
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets"]
        scope: Namespaced
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (!has(object.spec.template.spec.nodeSelector)
          ? [JSONPatch{op: "add", path: "/spec/template/spec/nodeSelector", value: {}}] : [])
          + [JSONPatch{op: "add", path: "/spec/template/spec/nodeSelector/airaware.training~1pool", value: "training-hami"},
             JSONPatch{op: "add", path: "/spec/template/spec/nodeSelector/airaware.training.node-restriction.kubernetes.io~1gpu-mode", value: "hami"}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: nebius-hami-runtime-daemonsets
spec:
  policyName: nebius-hami-runtime-daemonsets
