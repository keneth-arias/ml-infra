spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-device-plugin
      app.kubernetes.io/name: hami
      app.kubernetes.io/instance: hami
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-device-plugin
        hami.io/webhook: ignore
        app.kubernetes.io/name: hami
        app.kubernetes.io/instance: hami
      annotations:
        checksum/hami-scheduler-config: 8057e7fd36b2f4615f9d1a1209bfc0f6140cef29c17f27784470886bea82590c
        checksum/hami-scheduler-device-config: ef79da7ca6f68ad0fee5fde3215066117190f455230db3957cfb954d33c6b06e
    spec:
      runtimeClassName: nvidia
      serviceAccountName: hami-device-plugin
      hostPID: true
      hostNetwork: false
      initContainers:
      - name: toolkit-validation
        image: docker.io/projecthami/hami:v2.11.0@sha256:caab978ed50e53163c31ed7c4650c4e6e5d8facf157f377c26e021ff5fa3e5ce
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsUser: 0
        command:
        - sh
        - -c
        args:
        - "echo \"Waiting for NVIDIA Toolkit to be ready...\"\nuntil [ -f /run/nvidia/validations/toolkit-ready ]; do \n \
          \ echo \"Waiting for /run/nvidia/validations/toolkit-ready...\"\n  sleep 5\ndone\necho \"NVIDIA Toolkit is ready!\"\
          \n"
        volumeMounts:
        - name: nvidia-validations
          mountPath: /run/nvidia/validations
          mountPropagation: HostToContainer
          readOnly: true
      containers:
      - name: device-plugin
        image: docker.io/projecthami/hami:v2.11.0@sha256:caab978ed50e53163c31ed7c4650c4e6e5d8facf157f377c26e021ff5fa3e5ce
        imagePullPolicy: IfNotPresent
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - /k8s-vgpu/bin/vgpu-init.sh /usr/local/vgpu/
        command:
        - nvidia-device-plugin
        - --config-file=/device-config.yaml
        - --mig-strategy=none
        - --disable-core-limit=false
        - --report-node-capacity=false
        - -v=4
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NVIDIA_MIG_MONITOR_DEVICES
          value: all
        - name: DEVICE_LIST_STRATEGY
          value: envvar
        - name: HOOK_PATH
          value: /usr/local
        - name: HAMI_VGPU_CACHE_ROOT
          value: /usr/local/vgpu/containers
        - name: HAMI_VGPU_CACHE_GRACE_PERIOD
          value: 5m
        - name: PASS_DEVICE_SPECS
          value: 'true'
        - name: NVIDIA_DRIVER_ROOT
          value: /run/nvidia/driver
        - name: DISABLE_HAMI_CORE_FOR_WHOLE_GPU
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
            drop:
            - ALL
          privileged: true
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: lib
          mountPath: /usr/local/vgpu
        - name: ctrs
          mountPath: /usr/local/vgpu/containers
        - name: usrbin
          mountPath: /usrbin
        - name: deviceconfig
          mountPath: /config
        - name: hosttmp
