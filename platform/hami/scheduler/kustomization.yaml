apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../system
patches:
- patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: hami-device-plugin
      namespace: hami-system
- patch: |
    $patch: delete
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: hami-device-plugin
      namespace: hami-system
- patch: |
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: hami-device-plugin-monitor
      namespace: hami-system
- patch: |
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: hami-device-plugin
      namespace: hami-system
- target:
    group: apps
    version: v1
    kind: Deployment
    name: hami-scheduler
  patch: |
    - op: test
      path: /spec/template/spec/containers/1/command/16
      value: --device-plugin-namespace=hami-system
    - op: replace
      path: /spec/template/spec/containers/1/command/16
      value: --device-plugin-namespace=hami-device
