apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: airaware-gpu-worker
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: training
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  variables:
  - name: trainers
    expression: >-
      object.spec.containers.filter(c, c.name == 'ray-node' &&
      (c.image.contains('/airaware-joint') || c.image.contains('/ml-infra-qwen')) &&
      has(c.resources) && has(c.resources.limits) && 'nvidia.com/gpu' in c.resources.limits)
  validations:
  - expression: >-
      variables.trainers.all(c, has(c.volumeMounts) && c.volumeMounts.exists(m,
      m.mountPath == '/opt/airaware' && has(m.readOnly) && m.readOnly &&
      object.spec.volumes.exists(v, v.name == m.name && has(v.configMap) &&
      v.configMap.name == 'airaware-workers-v1')))
    message: El perfil de SkyPilot para AirAware requiere el lanzador con límite de VRAM en /opt/airaware.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: airaware-gpu-worker
spec:
  policyName: airaware-gpu-worker
  validationActions: [Deny]
