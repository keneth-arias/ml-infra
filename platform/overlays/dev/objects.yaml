apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: objects
  namespace: ml-platform
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: objects
  namespace: ml-platform
spec:
  selector:
    app: objects
  ports:
  - port: 10000
    targetPort: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objects
  namespace: ml-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: objects
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: objects
        image: versity/versitygw@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
        imagePullPolicy: IfNotPresent
        args:
        - --port
        - :10000
        - posix
        - /data
        env:
        - name: ROOT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tracking-credentials
              key: s3-id
        - name: ROOT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tracking-credentials
              key: s3-secret
        ports:
        - containerPort: 10000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 10000
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: objects
