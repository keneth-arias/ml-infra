apiVersion: v1
kind: ResourceQuota
metadata:
  name: training-memory
  namespace: training
spec:
  hard:
    limits.memory: 55G
---
apiVersion: v1
kind: LimitRange
metadata:
  name: training-memory
  namespace: training
spec:
  limits:
  - type: Container
    default:
      memory: 2Gi
    defaultRequest:
      memory: 256Mi
    max:
      memory: 55G
