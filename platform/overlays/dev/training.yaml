apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoints
  namespace: training
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-budget
  namespace: training
spec:
  hard:
    requests.nvidia.com/gpu: '2'
