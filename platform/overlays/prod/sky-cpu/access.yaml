apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: sky-cpu}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: skypilot-service-account, namespace: sky-cpu}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sky-backend, namespace: sky-cpu}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cpu-submit, namespace: sky-cpu}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: native-jobs, namespace: sky-cpu}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: native-jobs, namespace: sky-cpu}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-jobs}
subjects:
  - {kind: ServiceAccount, name: cpu-submit, namespace: sky-cpu}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sky-backend, namespace: sky-cpu}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [serviceaccounts, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sky-backend, namespace: sky-cpu}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sky-backend}
subjects:
  - {kind: ServiceAccount, name: sky-backend, namespace: sky-cpu}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sky-cpu-discovery}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sky-cpu-discovery}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sky-cpu-discovery}
subjects:
  - {kind: ServiceAccount, name: sky-backend, namespace: sky-cpu}
