apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: sky-cpu-workload}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  variables:
    - name: nativeImage
      expression: "'docker.io/library/python@sha256:b701198cb708b68d9413ca67d6311bd97c9389a2c5fe4da0511fc652642366cd'"
    # Single-head, rootless 0.14.3 build qualified on the local Restricted namespace.
    - name: skyImage
      expression: "'ghcr.io/keneth-arias/ml-infra-sky-cpu@sha256:cb68d75ec0c035420cadc896751df00d7f1639b45de2afbf9959c47c341d5381'"
    - name: pod
      expression: "request.kind.kind == 'Job' ? object.spec.template.spec : object.spec"
    - name: previousPod
      expression: "oldObject == null ? null : (request.kind.kind == 'Job' ? oldObject.spec.template.spec : oldObject.spec)"
  validations:
    - expression: "variables.pod.serviceAccountName == 'skypilot-service-account' && has(variables.pod.automountServiceAccountToken) && !variables.pod.automountServiceAccountToken"
      message: Require the token-free pilot workload account.
    - expression: >-
        has(variables.pod.activeDeadlineSeconds) && variables.pod.activeDeadlineSeconds > 0
        && variables.pod.activeDeadlineSeconds <= 900
        && (request.kind.kind != 'Job' || (has(object.spec.activeDeadlineSeconds)
        && object.spec.activeDeadlineSeconds > 0 && object.spec.activeDeadlineSeconds <= 180))
      message: Require a bounded CPU pilot lifetime.
    - expression: >-
        !has(variables.pod.securityContext) || !has(variables.pod.securityContext.sysctls)
        || variables.pod.securityContext.sysctls.all(s, s.name == 'net.ipv4.ip_unprivileged_port_start' && s.value == '22')
      message: Only the rootless SSH port setting is permitted.
    - expression: >-
        has(variables.pod.nodeSelector) && 'airaware.training/pool' in variables.pod.nodeSelector
        && variables.pod.nodeSelector['airaware.training/pool'] == 'training-cpu'
        && (!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler')
        && (!has(variables.pod.nodeName) || (request.operation == 'UPDATE' && request.kind.kind == 'Pod'
        && has(variables.previousPod.nodeName) && variables.pod.nodeName == variables.previousPod.nodeName))
      message: Require the CPU pool and the default scheduler.
    - expression: >-
        !has(variables.pod.tolerations) || variables.pod.tolerations.all(t, has(t.key) && t.key in
        ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable', 'node.kubernetes.io/memory-pressure'])
      message: Unexpected toleration for the CPU pilot.
    - expression: >-
        (!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir))) &&
        (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) &&
        (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)
      message: Permit only ephemeral scratch volumes and the pilot container.
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:sky-cpu:sky-backend'
        || variables.pod.containers.all(c, c.image == variables.skyImage)
      message: SkyPilot requires its separately qualified CPU image.
    - expression: >-
        (!has(variables.pod.imagePullSecrets) || (size(variables.pod.imagePullSecrets) <= 1
        && variables.pod.imagePullSecrets.all(s, s.name == 'sky-cpu-pull')))
        && (!has(variables.pod.resourceClaims) || size(variables.pod.resourceClaims) == 0)
        && !has(variables.pod.runtimeClassName)
      message: Unexpected credential, device claim or runtime override.
    - expression: >-
        size(variables.pod.containers) == 1 && variables.pod.containers.all(c,
        c.image in [variables.nativeImage, variables.skyImage] && c.image.matches('@sha256:[0-9a-f]{64}$')
        && (!has(c.envFrom) || size(c.envFrom) == 0)
        && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || has(e.valueFrom.fieldRef) || has(e.valueFrom.resourceFieldRef))))
      message: Require an approved digest and exclude indirect credentials.
    - expression: >-
        request.kind.kind != 'Job' || variables.pod.containers.all(c, c.image == variables.nativeImage)
      message: Native Jobs require their CPU qualification image.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: sky-cpu-workload}
spec:
  policyName: sky-cpu-workload
  matchResources:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sky-cpu}}
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: sky-cpu-services}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: "object.spec.type == 'ClusterIP' && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)"
      message: Only internal ClusterIP or headless services are permitted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: sky-cpu-services}
spec:
  policyName: sky-cpu-services
  matchResources:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sky-cpu}}
  validationActions: [Deny]
