apiVersion: v1
kind: LimitRange
metadata:
  name: cpu
  namespace: sky-cpu
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 2Gi}
      max: {cpu: "2", memory: 4Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pilot
  namespace: sky-cpu
spec:
  hard:
    pods: "3"
    requests.cpu: "2"
    limits.cpu: "3"
    requests.memory: 5Gi
    limits.memory: 8Gi
    requests.nvidia.com/gpu: "0"
    persistentvolumeclaims: "0"
    services: "3"
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/jobs.batch: "2"
