apiVersion: v1
kind: ServiceAccount
metadata:
  name: episode-submit
  namespace: training
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: episode-submit
  namespace: training
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: episode-submit
  namespace: training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: episode-submit
subjects:
  - kind: ServiceAccount
    name: episode-submit
    namespace: training
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: episode-drain, namespace: training}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: episode-drain, namespace: training}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: episode-drain, namespace: training}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: episode-drain}
subjects: [{kind: ServiceAccount, name: episode-drain, namespace: training}]
