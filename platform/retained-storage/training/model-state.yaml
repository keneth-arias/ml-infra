apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: airaware-model-state
  namespace: training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: airaware-network-retain-immediate
  resources:
    requests:
      storage: 64Gi
