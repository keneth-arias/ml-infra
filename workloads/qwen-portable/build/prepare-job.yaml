apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-portable-prepare
  namespace: airaware-web-refresh
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: bm
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prepare
        image: docker.io/ml-infra/airaware-joint@sha256:14eb3ed9b9ca00c75acbc56991d0f1882dc8efc5306ccf5fa90366673f40b3be
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -euxc
        - |
          umask 077
          mkdir -p /export/deps /export/source /export/assets /export/exports
          /opt/conda/bin/python -u -c 'import torch, transformers, peft, safetensors; print(torch.__version__, transformers.__version__, peft.__version__, safetensors.__version__)'
          /opt/conda/bin/python -m pip install --no-cache-dir --no-deps --target /export/deps openvino==2026.4.1 "mlx[cpu]==0.32.4" mlx-cpu==0.32.4
        env:
        - name: HOME
          value: /tmp
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: export
          mountPath: /export
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: export
        persistentVolumeClaim:
          claimName: qwen-portable-build
      - name: tmp
        emptyDir: {}
