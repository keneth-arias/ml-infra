name: airaware-qwen
num_nodes: 1
resources:
  infra: k8s/dev-bm
  accelerators: rtx5070ti:2
  cpus: 6
  memory: 16
  image_id: docker:ghcr.io/keneth-arias/ml-infra-qwen@sha256:32b27ab5bc82060bde95e565348dd7fd54b004015cc2dddd7df0747653fbe1d9
config:
  kubernetes:
    remote_identity: NONE
    pod_config:
      spec:
        containers:
          - name: ray-node
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - name: storage
                mountPath: /inputs
                subPath: airaware/inputs
                readOnly: true
              - name: storage
                mountPath: /checkpoints
                subPath: airaware/runs
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: storage
            persistentVolumeClaim:
              claimName: airaware-checkpoints
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
envs:
  MLFLOW_TRACKING_URI: http://mlflow.ml-platform.svc:5000
  OMP_NUM_THREADS: "2"
  RUN_ID:
  TRAIN_MODE: fsdp
  HEAD: direct
  PRECISION: fp32
  STOP_STEP: "4"
  SCHEDULE_STEPS: "4"
  SAVE_SECONDS: "900"
  RESUME: "0"
  LORA: "0"
  BATCH: "4"
  INPUT_VERSION: pilot
  VALIDATE_AT: checkpoint
run: |
  set -eu
  train() {
    run_id=$1
    view=${4:-}
    set -- --mode "$2" --head "$3" --precision "$PRECISION" --stop-step "$STOP_STEP" --schedule-steps "$SCHEDULE_STEPS" --save-seconds "$SAVE_SECONDS" --batch "$BATCH" --input-version "$INPUT_VERSION" --validate-at "$VALIDATE_AT"
    if [ -n "$view" ]; then set -- "$@" --input-view "$view"; fi
    if [ "$LORA" = "1" ]; then set -- "$@" --lora; fi
    if [ "$RESUME" = "1" ]; then set -- "$@" --resume; fi
    /opt/conda/bin/python /opt/ml-infra/airaware.py "$run_id" "$@"
  }
  : "${RUN_ID:?Provide RUN_ID}"
  if [ "$TRAIN_MODE" != "pair" ] && [ "$TRAIN_MODE" != "joint" ]; then
    train "$RUN_ID" "$TRAIN_MODE" "$HEAD"
    exit
  fi
  devices=${CUDA_VISIBLE_DEVICES:-0,1}
  first=${devices%%,*}
  second=${devices#*,}
  case "$second" in *,*|'') echo "Pair training needs exactly two visible GPUs" >&2; exit 2 ;; esac
  if [ -z "$first" ] || [ "$first" = "$second" ]; then
    echo "Pair training needs distinct GPUs" >&2
    exit 2
  fi
  if [ "$TRAIN_MODE" = joint ]; then
    CUDA_VISIBLE_DEVICES="$first" train "$RUN_ID-first" single direct first &
    direct_pid=$!
    CUDA_VISIBLE_DEVICES="$second" train "$RUN_ID-both" single direct both &
  else
    CUDA_VISIBLE_DEVICES="$first" train "$RUN_ID-direct" single direct &
    direct_pid=$!
    CUDA_VISIBLE_DEVICES="$second" train "$RUN_ID-persistence" single persistence &
  fi
  residual_pid=$!
  status=0
  wait "$direct_pid" || status=$?
  wait "$residual_pid" || status=$?
  exit "$status"
