name: airaware-qwen
num_nodes: 1
resources:
  infra: k8s/dev-bm
  accelerators: rtx5070ti:2
  cpus: 6
  memory: 16
  image_id: docker:ghcr.io/keneth-arias/ml-infra-qwen@sha256:549f56bc614674399df79345941a44a7ebfa6182492ea61aa653c62711accea1
config:
  kubernetes:
    remote_identity: NONE
    pod_config:
      spec:
        containers:
          - name: ray-node
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - name: storage
                mountPath: /inputs
                subPath: airaware/inputs
                readOnly: true
              - name: storage
                mountPath: /checkpoints
                subPath: airaware/runs
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: storage
            persistentVolumeClaim:
              claimName: airaware-checkpoints
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
envs:
  MLFLOW_TRACKING_URI: http://mlflow.ml-platform.svc:5000
  OMP_NUM_THREADS: "2"
  RUN_ID:
  TRAIN_MODE: fsdp
  HEAD: direct
  PRECISION: fp32
  STOP_STEP: "4"
  SCHEDULE_STEPS: "4"
  SAVE_SECONDS: "900"
  RESUME: "0"
  LORA: "0"
  BATCH: "4"
run: |
  set -eu
  set -- --mode "$TRAIN_MODE" --head "$HEAD" --precision "$PRECISION" --stop-step "$STOP_STEP" --schedule-steps "$SCHEDULE_STEPS" --save-seconds "$SAVE_SECONDS" --batch "$BATCH"
  if [ "$LORA" = "1" ]; then set -- "$@" --lora; fi
  if [ "$RESUME" = "1" ]; then set -- "$@" --resume; fi
  /opt/conda/bin/python /opt/ml-infra/airaware.py "${RUN_ID:?Provide RUN_ID}" "$@"
